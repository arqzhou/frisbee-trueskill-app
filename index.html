  /* ---------------- views: player ---------------- */
  function skillChart(points, cfg) {
    var W = 340, H = 190, L = 30, R = 8, T = 10, B = 22;
    var start = { skill: cfg.mu - 3 * cfg.sigma, mu: cfg.mu };
    var pts = [start].concat(points);
    var vals = [];
    pts.forEach(function (p) { vals.push(p.skill, p.mu); });
    var lo = Math.floor(Math.min.apply(null, vals) / 5) * 5, hi = Math.ceil(Math.max.apply(null, vals) / 5) * 5;
    if (hi - lo < 10) hi = lo + 10;
    var step = (hi - lo) > 30 ? 10 : 5;
    function X(i) { return L + (pts.length === 1 ? 0 : i * (W - L - R) / (pts.length - 1)); }
    function Y(v) { return T + (hi - v) * (H - T - B) / (hi - lo); }
    var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Skill over time">';
    for (var v = lo; v <= hi; v += step) {
      s += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '"/>' +
        '<text class="axis" x="' + (L - 4) + '" y="' + (Y(v) + 3) + '" text-anchor="end">' + v + '</text>';
    }
    var dSkill = '', dMu = '';
    pts.forEach(function (p, i) {
      dSkill += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.skill).toFixed(1);
      dMu += (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.mu).toFixed(1);
    });
    s += '<path class="mu" d="' + dMu + '"/><path class="skill" d="' + dSkill + '"/>';
    if (pts.length <= 40) pts.forEach(function (p, i) { if (i) s += '<circle class="pt" cx="' + X(i).toFixed(1) + '" cy="' + Y(p.skill).toFixed(1) + '" r="2.5"/>'; });
    s += '<text class="axis" x="' + L + '" y="' + (H - 6) + '">start</text>';
    if (points.length) s += '<text class="axis" x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end">' + esc(fmtDate(points[points.length - 1].date)) + '</text>';
    s += '</svg><div class="legend"><span style="color:var(--accent)">━ Skill (μ−3σ)</span><span>┅ μ</span><span>one point per game</span></div>';
    return s;
  }

  function viewPlayer(id) {
    var p = playerById(id);
    if (!p) return '<div class="card empty muted">Player not found.</div>';
    var rep = computed().rep;
    var r = ratingOf(id);
    var tl = rep.timeline[id] || [];
    var R = rankings(true);
    var rankRow = null;
    R.rated.forEach(function (x) { if (x.player.id === id) rankRow = x; });
    var activeRank = null;
    rankings(false).rated.forEach(function (x) { if (x.player.id === id) activeRank = x.rank; });
    var h = '<h2 class="pname">' + esc(p.name) +
      (r.games < state.settings.provisionalGames ? '<span class="badge">Provisional</span>' : '') +
      (p.active ? '' : '<span class="badge" style="color:var(--muted)">Inactive</span>') + '</h2>';
    h += '<div class="stats">' +
      '<div class="stat"><div class="v">' + fx(E.conservativeSkill(r), 1) + '</div><div class="k">Skill</div></div>' +
      '<div class="stat"><div class="v">' + (activeRank ? '#' + activeRank : '–') + '</div><div class="k">Rank</div></div>' +
      '<div class="stat"><div class="v">' + r.games + '</div><div class="k">Games</div></div>' +
      '<div class="stat"><div class="v">' + fx(r.mu, 2) + '</div><div class="k">μ (mean)</div></div>' +
      '<div class="stat"><div class="v">' + fx(r.sigma, 2) + '</div><div class="k">σ (uncertainty)</div></div>' +
      '<div class="stat"><div class="v">' + r.wins + '-' + r.losses + '-' + r.draws + '</div><div class="k">W-L-D</div></div></div>';
    h += '<div class="card"><div class="label">Skill over time</div>' +
      (tl.length ? skillChart(tl, state.settings) : '<p class="muted small">No games yet.</p>') + '</div>';
    if (tl.length) {
      h += '<div class="card"><div class="label">Recent games</div>';
      tl.slice(-15).reverse().forEach(function (e) {
        var g = gameById(e.gameId);
        var res = rep.results[e.gameId];
        if (!g || !res) return;
        var myTeam = -1;
        g.teams.forEach(function (t, i) { if (t.playerIds.indexOf(id) >= 0) myTeam = i; });
        var others = g.teams.filter(function (t, i) { return i !== myTeam; }).map(function (t) { return t.score; });
        var o = res.outcomes[myTeam];
        var label = o === 'W' ? 'W' : o === 'L' ? 'L' : o === 'D' ? 'D' : (res.ranks[myTeam] + 1) + ordinal(res.ranks[myTeam] + 1);
        var color = o === 'W' ? 'var(--good)' : o === 'L' ? 'var(--bad)' : 'var(--muted)';
        var mates = g.teams[myTeam].playerIds.filter(function (x) { return x !== id; }).map(playerName);
        h += '<a class="rg" href="#edit/' + encodeURIComponent(g.id) + '"><span class="res" style="color:' + color + '">' + label + '</span>' +
          '<div class="mid"><div><b>' + esc(g.teams[myTeam].score) + '–' + others.join('–') + '</b> · ' + esc(typeName(g.typeId)) + '</div>' +
          '<div class="small muted">' + fmtDate(g.date) + (mates.length ? ' · with ' + esc(mates.join(', ')) : '') + '</div></div>' +
          '<span class="dl ' + (e.deltaSkill > 0.005 ? 'up' : e.deltaSkill < -0.005 ? 'down' : 'muted') + '">' + signed(e.deltaSkill, 2) + '</span></a>';
      });
      h += '</div>';
    }
    return h;
  }
  function ordinal(n) { return (n % 10 === 1 && n % 100 !== 11) ? 'st' : (n % 10 === 2 && n % 100 !== 12) ? 'nd' : (n % 10 === 3 && n % 100 !== 13) ? 'rd' : 'th'; }

  /* ---------------- views: settings ---------------- */
  var SETTING_FIELDS = [
    { key: 'drawProbability', label: 'Draw probability', desc: 'Chance two even teams tie (TrueSkill draw margin)', min: 0.01, max: 0.5, step: 0.01 },
    { key: 'minMargin', label: 'Margin factor min', desc: 'Multiplier for a 1-point game', min: 0, max: 3, step: 0.05 },
    { key: 'maxMargin', label: 'Margin factor max', desc: 'Multiplier for a shutout', min: 0, max: 3, step: 0.05 },
    { key: 'provisionalGames', label: 'Provisional below', desc: 'Rated games before a player is established', min: 0, max: 100, step: 1, int: true }
  ];
  var ADVANCED_FIELDS = [
    { key: 'mu', label: 'Initial μ', min: -1000, max: 1000, step: 0.5 },
    { key: 'sigma', label: 'Initial σ', min: 0.01, max: 1000, step: 0.1 },
    { key: 'beta', label: 'β (performance noise)', min: 0.01, max: 1000, step: 0.1 },
    { key: 'tau', label: 'τ (skill drift per game)', min: 0, max: 100, step: 0.01 },
    { key: 'sigmaFloor', label: 'σ floor', min: 0.01, max: 100, step: 0.1 },
    { key: 'maxWeight', label: 'Max effective weight', min: 0, max: 5, step: 0.05 }
  ];
  function settingRow(fd) {
    return '<div class="set-row"><div><div>' + fd.label + '</div>' + (fd.desc ? '<div class="desc">' + fd.desc + '</div>' : '') + '</div>' +
      '<input type="number" inputmode="decimal" step="' + fd.step + '" min="' + fd.min + '" max="' + fd.max + '" data-setting="' + fd.key + '" value="' + esc(+state.settings[fd.key].toFixed(6)) + '"></div>';
  }
  function viewSettings() {
    var h = '<div class="card"><div class="label">Game types</div>';
    state.gameTypes.forEach(function (t) {
      h += '<div class="type-row">' +
        '<label class="f tname">Name<input data-type-id="' + esc(t.id) + '" data-type-field="name" value="' + esc(t.name) + '" maxlength="40"></label>' +
        '<label class="f">Weight<input type="number" inputmode="decimal" step="0.05" min="0" max="3" data-type-id="' + esc(t.id) + '" data-type-field="weight" value="' + esc(t.weight) + '"></label>' +
        '<label class="f">To<input type="number" inputmode="numeric" min="1" data-type-id="' + esc(t.id) + '" data-type-field="target" value="' + esc(t.target) + '"></label>' +
        '<button class="x" data-act="delete-type" data-id="' + esc(t.id) + '" aria-label="Delete ' + esc(t.name) + '">✕</button></div>';
    });
    h += '<button class="btn block" data-act="add-type" style="margin-top:8px">+ Add game type</button>' +
      '<p class="small muted">Weight scales how much a game moves ratings (Full field = 1.0). "To" is the default score target; each game keeps its own target. Changing a weight recalculates all history.</p></div>';

    h += '<div class="card"><div class="label">Rating</div>';
    SETTING_FIELDS.forEach(function (fd) { h += settingRow(fd); });
    h += '<details><summary>Advanced TrueSkill parameters</summary>';
    ADVANCED_FIELDS.forEach(function (fd) { h += settingRow(fd); });
    h += '<button class="btn block" data-act="reset-params" style="margin:8px 0">Reset rating parameters to defaults</button></details>' +
      '<p class="small muted">Game weight = type weight × margin factor, clamped to [0, ' + fx(state.settings.maxWeight, 2) + ']. Every change replays all games from scratch.</p></div>';

    h += '<div class="card stack"><div class="label">Data</div>' +
      '<button class="btn block" data-act="export">Export backup (JSON)</button>' +
      '<button class="btn block" data-act="copy-json">Copy backup to clipboard</button>' +
      '<button class="btn block" data-act="import">Import backup…</button>' +
      '<button class="btn block" data-act="load-demo">Load demo data</button>' +
      '<button class="btn block danger" data-act="reset-all">Erase all players &amp; games…</button>' +
      '<p class="small muted">Data lives only on this device, in this browser. On iPhone, the Home Screen app and Safari keep <b>separate</b> storage — use Export/Import to move data between them, and export regularly as a backup.</p></div>';
    h += '<p class="small muted" style="text-align:center">Schema v' + SCHEMA_VERSION + ' · ' + state.players.length + ' players · ' + state.games.length + ' games</p>';
    return h;
  }

  /* ---------------- actions ---------------- */
  function assignPlayer(f, id) {
    var from = -1;
    f.teams.forEach(function (t, i) { if (t.playerIds.indexOf(id) >= 0) from = i; });
    if (from >= 0) f.teams[from].playerIds.splice(f.teams[from].playerIds.indexOf(id), 1);
    if (from !== f.active) f.teams[f.active].playerIds.push(id);
  }

  function formChanged() { if (route.view === 'record') saveDraftSoon(); render(); }

  function addPlayer(name) {
    name = String(name || '').trim().replace(/\s+/g, ' ');
    if (!name) return null;
    var dup = state.players.some(function (p) { return p.name.toLowerCase() === name.toLowerCase(); });
    if (dup && !confirm('There is already a player named "' + name + '". Add another?')) return null;
    var p = { id: uid('p_'), name: name, active: true, createdAt: Date.now() };
    state.players.push(p);
    commit();
    return p;
  }

  var actions = {
    back: function () { if (history.length > 1) history.back(); else go('#rankings'); },
    'dismiss-demo': function () { state.prefs.demo = false; persist(); render(); },
    type: function (el) {
      var f = currentForm(); var t = typeById(el.dataset.id); if (!t) return;
      f.typeId = t.id;
      if (!f.targetTouched) f.target = String(t.target);
      formChanged();
    },
    'team-activate': function (el) { var f = currentForm(); var i = +el.dataset.i; if (f.active !== i) { f.active = i; formChanged(); } },
    'team-add': function () {
      var f = currentForm(); if (f.teams.length >= MAX_TEAMS) return;
      f.teams.push(blankTeam()); f.active = f.teams.length - 1; formChanged();
    },
    'team-remove': function (el) {
      var f = currentForm(); var i = +el.dataset.i; if (f.teams.length <= 2) return;
      f.teams.splice(i, 1); f.active = Math.min(f.active, f.teams.length - 1); formChanged();
    },
    'score-inc': function (el) { var t = currentForm().teams[+el.dataset.i]; t.score = String(Math.max(0, Math.floor(num(t.score, 0)) + 1)); formChanged(); },
    'score-dec': function (el) { var t = currentForm().teams[+el.dataset.i]; t.score = String(Math.max(0, Math.floor(num(t.score, 1)) - 1)); formChanged(); },
    pool: function (el) { assignPlayer(currentForm(), el.dataset.id); formChanged(); },
    'member-remove': function (el) {
      var t = currentForm().teams[+el.dataset.i]; var k = t.playerIds.indexOf(el.dataset.id);
      if (k >= 0) t.playerIds.splice(k, 1); formChanged();
    },
    rematch: function () {
      var f = currentForm(); var last = state.prefs.lastTeams || [];
      var teams = last.map(function (ids) { return { playerIds: ids.filter(function (id) { return playerById(id); }), score: '' }; });
      while (teams.length < 2) teams.push(blankTeam());
      f.teams = teams.slice(0, MAX_TEAMS); f.active = 0;
      var t = typeById(state.prefs.lastTypeId);
      if (t) { f.typeId = t.id; if (!f.targetTouched) f.target = String(t.target); }
      formChanged(); toast('Loaded last teams');
    },
    'clear-form': function () {
      var keep = recordForm; recordForm = newForm();
      if (keep) { recordForm.typeId = keep.typeId; recordForm.date = keep.date; recordForm.target = String((typeById(keep.typeId) || {}).target || recordForm.target); }
      formChanged();
    },
    'new-player': function () {
      var name = prompt('New player name');
      var p = addPlayer(name);
      if (p) { var f = currentForm(); f.teams[f.active].playerIds.push(p.id); formChanged(); toast(p.name + ' added to ' + teamLabel(f.active)); }
    },
    'save-game': saveForm,
    'delete-game': function () {
      var f = currentForm(); if (!f || !f.editingId) return;
      if (!confirm('Delete this game? All ratings will be recalculated without it.')) return;
      state.games = state.games.filter(function (g) { return g.id !== f.editingId; });
      editForm = null; commit(); toast('Game deleted — ratings recalculated'); go('#history');
    },
    rename: function (el) {
      var p = playerById(el.dataset.id); if (!p) return;
      var name = prompt('Rename player', p.name);
      if (name == null) return;
      name = name.trim().replace(/\s+/g, ' ');
      if (!name) return;
      p.name = name; commit(); render();
    },
    'toggle-active': function (el) {
      var p = playerById(el.dataset.id); if (!p) return;
      p.active = !p.active; commit(); render(); toast(p.name + (p.active ? ' activated' : ' deactivated'));
    },
    'delete-player': function (el) {
      var p = playerById(el.dataset.id); if (!p) return;
      if (ratingOf(p.id).games > 0) { toast('Players with games can only be deactivated', true); return; }
      if (!confirm('Delete ' + p.name + '?')) return;
      state.players = state.players.filter(function (x) { return x.id !== p.id; });
      if (recordForm) recordForm.teams.forEach(function (t) { t.playerIds = t.playerIds.filter(function (id) { return id !== p.id; }); });
      commit(); render();
    },
    'add-type': function () {
      state.gameTypes.push({ id: uid('t_'), name: 'New drill', weight: 0.4, target: 10 });
      commit(); render();
      var inputs = document.querySelectorAll('[data-type-field="name"]');
      if (inputs.length) { inputs[inputs.length - 1].focus(); inputs[inputs.length - 1].select(); }
    },
    'delete-type': function (el) {
      var id = el.dataset.id;
      var used = state.games.filter(function (g) { return g.typeId === id; }).length;
      if (used) { toast('Used by ' + used + ' game' + (used === 1 ? '' : 's') + ' — rename it instead', true); return; }
      if (state.gameTypes.length <= 1) { toast('Keep at least one game type', true); return; }
      if (!confirm('Delete game type "' + typeName(id) + '"?')) return;
      state.gameTypes = state.gameTypes.filter(function (t) { return t.id !== id; });
      [recordForm, editForm].forEach(function (f) { if (f && f.typeId === id) f.typeId = state.gameTypes[0].id; });
      commit(); render();
    },
    'reset-params': function () {
      if (!confirm('Reset all rating parameters to defaults? Ratings will be recalculated.')) return;
      state.settings = defaultSettings(); commit(); render(); toast('Rating parameters reset');
    },
    export: function () { exportData(); },
    'copy-json': function () {
      var json = backupJSON();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(json).then(function () { toast('Backup copied to clipboard'); }, function () { toast('Copy failed', true); });
      } else toast('Clipboard not available here', true);
    },
    import: function () { document.getElementById('import-file').click(); },
    'load-demo': function () {
      if (state.games.length && !confirm('Replace ALL current players and games with demo data?')) return;
      state = demoState(); recordForm = newForm(); editForm = null; commit(); go('#rankings'); toast('Demo data loaded');
    },
    'reset-all': function () {
      var answer = prompt('This erases all ' + state.players.length + ' players and ' + state.games.length + ' games on this device (game types and settings are kept).\n\nType ERASE to confirm.');
      if (answer == null) return;
      if (answer.trim().toUpperCase() !== 'ERASE') { toast('Not erased — you must type ERASE', true); return; }
      var keepTypes = state.gameTypes, keepSettings = state.settings;
      state = emptyState(); state.gameTypes = keepTypes; state.settings = keepSettings;
      recordForm = newForm(); editForm = null; commit(); go('#roster'); toast('All players and games erased');
    }
  };

  function backupJSON() {
    var data = clone(state);
    data.exportedAt = new Date().toISOString();
    return JSON.stringify(data, null, 2);
  }
  function exportData() {
    var json = backupJSON();
    var name = 'frisbee-trueskill-' + todayISO() + '.json';
    var file = null;
    try { file = new File([json], name, { type: 'application/json' }); } catch (e) {}
    if (file && isIOS() && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: name }).catch(function (err) { if (err && err.name !== 'AbortError') download(json, name); });
      return;
    }
    download(json, name);
  }
  function download(text, name) {
    var url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    var a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    toast('Backup exported');
  }
  function importFile(file) {
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = normalize(JSON.parse(reader.result)); }
      catch (e) { toast('Import failed: ' + e.message, true); return; }
      if (!confirm('Replace all data on this device with this backup?\n\n' + data.players.length + ' players, ' + data.games.length + ' games.')) return;
      state = data; recordForm = sanitizeDraft(state.prefs.draft); editForm = null; commit();
      var errs = computed().rep.errors.length;
      go('#rankings');
      toast('Imported ' + data.games.length + ' games' + (errs ? ' (' + errs + ' could not be rated)' : ''), !!errs);
    };
    reader.onerror = function () { toast('Could not read that file', true); };
    reader.readAsText(file);
  }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target;
    if (t.closest('input, textarea, select, label.f, details summary')) return;
    var el = t.closest('[data-act]');
    if (el && actions[el.dataset.act]) { e.preventDefault(); actions[el.dataset.act](el); return; }
    var row = t.closest('tr[data-href]');
    if (row) go(row.getAttribute('data-href'));
  });

  document.addEventListener('input', function (e) {
    var el = e.target, field = el.dataset && el.dataset.field;
    if (!field) return;
    var f = currentForm(); if (!f) return;
    if (field === 'date') f.date = el.value;
    else if (field === 'target') { f.target = el.value; f.targetTouched = true; }
    else if (field === 'score') f.teams[+el.dataset.i].score = el.value;
    else if (field === 'notes') f.notes = el.value;
    var wp = document.getElementById('weight-preview'); if (wp) wp.innerHTML = formWeightText(f);
    var fe = document.getElementById('form-error'); if (fe) fe.textContent = '';
    if (route.view === 'record') saveDraftSoon();
  });

  document.addEventListener('change', function (e) {
    var el = e.target;
    if (el.id === 'import-file') { if (el.files && el.files[0]) importFile(el.files[0]); el.value = ''; return; }
    if (el.dataset.change === 'toggle-inactive') { state.prefs.showInactive = el.checked; persist(); render(); return; }
    if (el.dataset.setting) { changeSetting(el); return; }
    if (el.dataset.typeField) { changeType(el); return; }
  });

  function changeSetting(el) {
    var key = el.dataset.setting;
    var fd = SETTING_FIELDS.concat(ADVANCED_FIELDS).filter(function (x) { return x.key === key; })[0];
    var v = Number(el.value);
    if (el.value === '' || !isFinite(v) || v < fd.min || v > fd.max || (fd.int && Math.floor(v) !== v)) {
      toast(fd.label + ' must be ' + (fd.int ? 'a whole number ' : '') + 'between ' + fd.min + ' and ' + fd.max, true);
      el.value = state.settings[key]; return;
    }
    var next = Object.assign({}, state.settings); next[key] = v;
    if (next.minMargin > next.maxMargin) { toast('Margin min must not exceed margin max', true); el.value = state.settings[key]; return; }
    state.settings = next; commit(); toast(fd.label + ' updated — ratings recalculated');
  }

  function changeType(el) {
    var t = typeById(el.dataset.typeId); if (!t) return;
    var field = el.dataset.typeField;
    if (field === 'name') {
      var name = el.value.trim();
      if (!name) { toast('Name cannot be empty', true); el.value = t.name; return; }
      t.name = name; commit(); return;
    }
    var v = Number(el.value);
    if (field === 'weight' && (el.value === '' || !isFinite(v) || v < 0 || v > 3)) { toast('Weight must be between 0 and 3', true); el.value = t.weight; return; }
    if (field === 'target' && (el.value === '' || !isFinite(v) || v < 1 || Math.floor(v) !== v)) { toast('Target must be a whole number ≥ 1', true); el.value = t.target; return; }
    t[field] = v; commit();
    toast(field === 'weight' ? 'Weight updated — ratings recalculated' : 'Default target updated (existing games keep theirs)');
  }

  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (form.dataset.form === 'add-player') {
      e.preventDefault();
      var input = form.elements.name;
      var p = addPlayer(input.value);
      if (p) { render(); toast(p.name + ' added'); var again = document.querySelector('form.addp input'); if (again) again.focus(); }
    }
  });

  window.addEventListener('hashchange', onRoute);

  /* ---------------- demo data ---------------- */
  // 12 players, 20 games over 5 sessions; includes 3-team and 4-team games,
  // a draw, bonus points above target, and a player joining mid-season.
  function demoState() {
    var s = emptyState();
    var names = ['Alex', 'Blake', 'Casey', 'Devon', 'Emery', 'Finley', 'Gray', 'Harper', 'Jordan', 'Kai', 'Logan', 'Morgan'];
    s.players = names.map(function (n, i) {
      return { id: 'demo-p' + (i + 1), name: n, active: true, createdAt: Date.parse(i < 11 ? '2026-09-01T12:00:00Z' : '2026-09-22T12:00:00Z') };
    });
    var G = [
      { d: '2026-09-08', t: 'warmup', teams: [[[0, 1, 2, 3, 4, 5], 5], [[6, 7, 8, 9, 10], 3]] },
      { d: '2026-09-08', t: 'drill', teams: [[[0, 2, 4], 10], [[1, 3, 5], 6]], n: '3v3 break-mark drill' },
      { d: '2026-09-08', t: 'mini', teams: [[[0, 6, 9], 7], [[1, 4, 10], 5], [[2, 3, 7, 8], 2]], n: '3-team round robin, aggregated' },
      { d: '2026-09-08', t: 'full7s', teams: [[[0, 2, 4, 6, 8], 15], [[1, 3, 5, 7, 9, 10], 11]] },
      { d: '2026-09-15', t: 'warmup', teams: [[[0, 3, 6, 9, 1], 4], [[2, 5, 8, 10, 4], 5]] },
      { d: '2026-09-15', t: 'mini', teams: [[[0, 1, 7], 7], [[2, 8, 9], 6]] },
      { d: '2026-09-15', t: 'drill', teams: [[[4, 6, 10], 12], [[3, 5, 7], 7]], n: 'Bonus points for completed hucks (12 > target 10)' },
      { d: '2026-09-15', t: 'full7s', teams: [[[0, 1, 4, 7, 9], 13], [[2, 3, 5, 6, 8, 10], 15]] },
      { d: '2026-09-22', t: 'warmup', teams: [[[11, 0, 2, 5], 5], [[1, 3, 4, 6], 5]], n: 'Morgan’s first practice — draw' },
      { d: '2026-09-22', t: 'mini', teams: [[[0, 4, 11], 7], [[1, 5, 8], 7], [[2, 6, 9, 10], 3]], n: '3 teams, top two tied' },
      { d: '2026-09-22', t: 'drill', teams: [[[0, 7], 10], [[11, 3], 8]] },
      { d: '2026-09-22', t: 'full7s', teams: [[[0, 3, 5, 8, 10, 11], 15], [[1, 2, 4, 6, 7, 9], 9]] },
      { d: '2026-09-29', t: 'warmup', teams: [[[0, 1, 2], 5], [[3, 4, 5], 2]] },
      { d: '2026-09-29', t: 'mini', teams: [[[0, 5, 10], 4], [[2, 7, 11], 7], [[1, 3, 9], 6]] },
      { d: '2026-09-29', t: 'full7s', teams: [[[0, 2, 4, 6, 8, 10], 16], [[1, 3, 5, 7, 9, 11], 12]], n: 'Callahan bonus: 16 > target 15' },
      { d: '2026-09-29', t: 'drill', teams: [[[4, 9], 10], [[6, 8], 3]] },
      { d: '2026-10-06', t: 'warmup', teams: [[[0, 4, 8, 11], 5], [[1, 5, 9, 2], 4]] },
      { d: '2026-10-06', t: 'mini', teams: [[[0, 3, 6], 7], [[1, 4, 7], 3]] },
      { d: '2026-10-06', t: 'drill', teams: [[[0, 1], 10], [[2, 3], 7], [[4, 5], 9], [[6, 7], 4]], n: '4-pair cutting drill' },
      { d: '2026-10-06', t: 'full7s', teams: [[[0, 1, 2, 3, 4, 5], 15], [[6, 7, 8, 9, 10, 11], 12]] }
    ];
    s.games = G.map(function (g, i) {
      var type = s.gameTypes.filter(function (t) { return t.id === g.t; })[0];
      return {
        id: 'demo-g' + (i + 1), date: g.d, createdAt: Date.parse(g.d + 'T18:00:00Z') + i * 60000, typeId: g.t,
        scoringTarget: type.target,
        teams: g.teams.map(function (t) { return { playerIds: t[0].map(function (k) { return 'demo-p' + (k + 1); }), score: t[1] }; }),
        notes: g.n || ''
      };
    });
    var last = s.games[s.games.length - 1];
    s.prefs.lastTeams = last.teams.map(function (t) { return t.playerIds.slice(); });
    s.prefs.lastTypeId = last.typeId;
    s.prefs.demo = true;
    return s;
  }

  /* ---------------- install metadata ---------------- */
  function setupManifest() {
    try {
      var icon = document.querySelector('link[rel="apple-touch-icon"]').href;
      var manifest = {
        name: 'Frisbee TrueSkill', short_name: 'TrueSkill', start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''),
        display: 'standalone', background_color: '#0b0d10', theme_color: '#0f766e',
        icons: [{ src: icon, sizes: '192x192', type: 'image/png', purpose: 'any' }]
      };
      document.getElementById('manifest-link').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    } catch (e) { /* non-essential */ }
  }

  /* ---------------- boot ---------------- */
  state = loadState();
  if (!state) { state = demoState(); persist(); }
  recordForm = sanitizeDraft(state.prefs.draft);
  setupManifest();
  onRoute();

  // Debug/test hook (read-only use).
  window.__app = { get state() { return state; }, computed: computed, rankings: rankings, demoState: demoState, normalize: normalize };
})();
</script>
</body>
</html>
